<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm Football Frenzy</title>
  <style>
    :root {
      --bg: #1f2937;
      --panel: #111827;
      --text: #f9fafb;
      --field: #2f7d32;
      --stripe: #3f9a43;
      --line: #f3f4f6;
      --left-endzone: #d97706;
      --right-endzone: #2563eb;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(to bottom, #87ceeb 0%, #c7f0ff 35%, #9acb67 35%, #7caf4c 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 16px;
      overscroll-behavior: none;
    }

    .game-shell {
      background: var(--panel);
      border: 4px solid #e5e7eb;
      box-shadow: 0 12px 30px var(--shadow);
      padding: 14px;
      border-radius: 10px;
      width: min(100%, 992px);
    }

    canvas {
      display: block;
      background: var(--field);
      border: 4px solid #111;
      /* Smooth scaling when CSS scales the canvas (avoids blocky team banners & UI) */
      image-rendering: auto;
      max-width: 100%;
      height: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .help {
      margin-top: 10px;
      text-align: center;
      color: #d1d5db;
      font-size: 14px;
      line-height: 1.4;
    }

    .help strong {
      color: #fff;
    }

    @media (max-width: 700px) {
      body {
        padding: 8px;
        align-items: stretch;
      }

      .game-shell {
        padding: 8px;
        border-width: 2px;
        border-radius: 0;
      }

      .help {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <canvas id="game" width="960" height="540" aria-label="Farm Football Frenzy"></canvas>
    <div class="help">
      <strong>Desktop:</strong> W A S D to move; click to throw; when you're on defense vs CPU offense, Space switches defenders. |
      <strong>Mobile:</strong> left joystick to move; tap the field to throw; tap Switch to change defenders. |
      <strong>Restart:</strong> R after game over
    </div>
  </div>

  <audio id="menuMusic" src="audio/Farm_Football_Frenzy_Titlescreen.mp3" loop></audio>
  <!-- loop: seamless replay in-browser; JS "ended" restart always adds a tiny gap -->
  <audio id="gameMusic" src="audio/Game_Music_Farm_Football_Frenzy.mp3" loop></audio>

  <script src="src/config.js"></script>
  <script src="src/teams.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/replay.js"></script>
  <script src="src/render.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
