<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm Football Frenzy</title>
  <style>
    :root {
      --bg: #1f2937;
      --panel: #111827;
      --text: #f9fafb;
      --field: #2f7d32;
      --stripe: #3f9a43;
      --line: #f3f4f6;
      --left-endzone: #d97706;
      --right-endzone: #2563eb;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(to bottom, #87ceeb 0%, #c7f0ff 35%, #9acb67 35%, #7caf4c 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .game-shell {
      background: var(--panel);
      border: 4px solid #e5e7eb;
      box-shadow: 0 12px 30px var(--shadow);
      padding: 14px;
      border-radius: 10px;
    }

    canvas {
      display: block;
      background: var(--field);
      border: 4px solid #111;
      image-rendering: pixelated;
      max-width: 100%;
      height: auto;
    }

    .help {
      margin-top: 10px;
      text-align: center;
      color: #d1d5db;
      font-size: 14px;
      line-height: 1.4;
    }

    .help strong {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <canvas id="game" width="960" height="540" aria-label="Farm Football Frenzy"></canvas>
    <div class="help">
      <strong>Controls:</strong> Barnaby moves with W A S D |
      <strong>Goal:</strong> Carry the football into Professor Pig's end zone |
      <strong>Restart:</strong> Press R after game over
    </div>
  </div>

  <script src="src/config.js"></script>
  <script src="src/input.js"></script>
  <script src="src/render.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
