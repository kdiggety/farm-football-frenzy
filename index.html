<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farm Football Frenzy</title>
  <style>
    :root {
      --bg: #1f2937;
      --panel: #111827;
      --text: #f9fafb;
      --field: #2f7d32;
      --stripe: #3f9a43;
      --line: #f3f4f6;
      --left-endzone: #d97706;
      --right-endzone: #2563eb;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(to bottom, #87ceeb 0%, #c7f0ff 35%, #9acb67 35%, #7caf4c 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .game-shell {
      background: var(--panel);
      border: 4px solid #e5e7eb;
      box-shadow: 0 12px 30px var(--shadow);
      padding: 14px;
      border-radius: 10px;
    }

    canvas {
      display: block;
      background: var(--field);
      border: 4px solid #111;
      image-rendering: pixelated;
      max-width: 100%;
      height: auto;
    }

    .help {
      margin-top: 10px;
      text-align: center;
      color: #d1d5db;
      font-size: 14px;
      line-height: 1.4;
    }

    .help strong {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <canvas id="game" width="960" height="540" aria-label="Farm Football Frenzy"></canvas>
    <div class="help">
      <strong>Controls:</strong> Barnaby moves with W A S D |
      <strong>Goal:</strong> Carry the football into Professor Pig's end zone |
      <strong>Restart:</strong> Press R after game over
    </div>
  </div>

  <script>
    // =========================================================
    // Constants / Config
    // =========================================================
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const FIELD = {
      x: 50,
      y: 80,
      width: 860,
      height: 400,
      endZoneWidth: 110
    };

    const CONFIG = {
      winScore: 5,
      playerRadius: 20,
      ballRadius: 9,
      playerSpeed: 250,
      cpuSpeed: 125, // Slightly slower than player
      possessionPickupLockMs: 220,
      scorePauseMs: 1400
    };

    const COLORS = {
      skyText: "#f9fafb",
      barn: "#8b5a2b",
      fence: "#d1b892",
      straw: "#facc15",
      donkey: "#2563eb",
      pig: "#ec4899",
      ball: "#8b4513",
      white: "#f9fafb",
      black: "#111827",
      shadow: "rgba(0,0,0,0.25)",
      leftEndZone: "#c2410c",
      rightEndZone: "#1d4ed8",
      field: "#2f7d32",
      fieldStripe: "#3d9140",
      line: "#eef2ff"
    };

    // =========================================================
    // Game State
    // =========================================================
    const game = {
      state: "playing", // "playing" | "scorePause" | "gameOver"
      winner: null,
      scorePauseTimer: 0,
      scoredBy: null,
      possessionLockTimer: 0,
      lastTime: 0
    };

    const keys = {};

    const player1 = {
      id: "player1",
      name: "Barnaby the Donkey",
      x: 0,
      y: 0,
      radius: CONFIG.playerRadius,
      speed: CONFIG.playerSpeed,
      color: COLORS.donkey,
      score: 0
    };

    const player2 = {
      id: "player2",
      name: "Professor Pig",
      x: 0,
      y: 0,
      radius: CONFIG.playerRadius,
      speed: CONFIG.cpuSpeed,
      color: COLORS.pig,
      score: 0
    };

    const ball = {
      x: 0,
      y: 0,
      radius: CONFIG.ballRadius,
      carrier: null // null | player1 | player2
    };

    // =========================================================
    // Utility
    // =========================================================
    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function distance(ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;
      return Math.hypot(dx, dy);
    }

    function circleTouch(a, b) {
      return distance(a.x, a.y, b.x, b.y) <= a.radius + b.radius;
    }

    function moveToward(entity, targetX, targetY, speed, dt) {
      const dx = targetX - entity.x;
      const dy = targetY - entity.y;
      const len = Math.hypot(dx, dy);

      if (len === 0) return;

      const nx = dx / len;
      const ny = dy / len;

      entity.x += nx * speed * dt;
      entity.y += ny * speed * dt;
    }

    function clampPlayerToField(player) {
      player.x = clamp(player.x, FIELD.x + player.radius, FIELD.x + FIELD.width - player.radius);
      player.y = clamp(player.y, FIELD.y + player.radius, FIELD.y + FIELD.height - player.radius);
    }

    function setBallFreeAtMidfield() {
      ball.carrier = null;
      ball.x = FIELD.x + FIELD.width / 2;
      ball.y = FIELD.y + FIELD.height / 2;
    }

    function updateBallPosition() {
      if (ball.carrier) {
        ball.x = ball.carrier.x;
        ball.y = ball.carrier.y - ball.carrier.radius - 8;
      }
    }

    // =========================================================
    // Reset / Restart Logic
    // =========================================================
    function resetPositions() {
      player1.x = FIELD.x + 170;
      player1.y = FIELD.y + FIELD.height / 2;

      player2.x = FIELD.x + FIELD.width - 170;
      player2.y = FIELD.y + FIELD.height / 2;

      setBallFreeAtMidfield();
      game.possessionLockTimer = 0;
    }

    function restartGame() {
      player1.score = 0;
      player2.score = 0;
      game.state = "playing";
      game.winner = null;
      game.scorePauseTimer = 0;
      game.scoredBy = null;
      game.possessionLockTimer = 0;
      resetPositions();
    }

    // =========================================================
    // Input Handling
    // =========================================================
    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      keys[key] = true;

      if (key === "r" && game.state === "gameOver") {
        restartGame();
      }

      if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
        e.preventDefault();
      }
    });

    window.addEventListener("keyup", (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    function updatePlayerInput(dt) {
      let dx = 0;
      let dy = 0;

      if (keys["w"]) dy -= 1;
      if (keys["s"]) dy += 1;
      if (keys["a"]) dx -= 1;
      if (keys["d"]) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        dx /= len;
        dy /= len;

        player1.x += dx * player1.speed * dt;
        player1.y += dy * player1.speed * dt;
      }

      clampPlayerToField(player1);
    }

    // =========================================================
    // CPU Logic
    // =========================================================
    function updateCPU(dt) {
      let targetX = player2.x;
      let targetY = player2.y;

      if (ball.carrier === null) {
        // Move toward the loose ball
        targetX = ball.x;
        targetY = ball.y;
      } else if (ball.carrier === player1) {
        // Move toward the human player
        targetX = player1.x;
        targetY = player1.y;
      } else if (ball.carrier === player2) {
        // Run toward the player's end zone (left side)
        targetX = FIELD.x + 20;
        targetY = FIELD.y + FIELD.height / 2;
      }

      moveToward(player2, targetX, targetY, player2.speed, dt);
      clampPlayerToField(player2);
    }

    // =========================================================
    // Game Logic
    // =========================================================
    function tryPickupBall() {
      if (game.possessionLockTimer > 0 || ball.carrier !== null) {
        return;
      }

      if (circleTouch(player1, ball)) {
        ball.carrier = player1;
        game.possessionLockTimer = CONFIG.possessionPickupLockMs;
        updateBallPosition();
        return;
      }

      if (circleTouch(player2, ball)) {
        ball.carrier = player2;
        game.possessionLockTimer = CONFIG.possessionPickupLockMs;
        updateBallPosition();
      }
    }

    function handleCarrierCollisionSteal() {
      if (game.possessionLockTimer > 0) {
        return;
      }

      if (ball.carrier === player1 && circleTouch(player1, player2)) {
        ball.carrier = player2;
        game.possessionLockTimer = CONFIG.possessionPickupLockMs;
        updateBallPosition();
      } else if (ball.carrier === player2 && circleTouch(player1, player2)) {
        ball.carrier = player1;
        game.possessionLockTimer = CONFIG.possessionPickupLockMs;
        updateBallPosition();
      }
    }

    function checkTouchdown() {
      if (game.state !== "playing" || !ball.carrier) return;

      const leftEndZoneRight = FIELD.x + FIELD.endZoneWidth;
      const rightEndZoneLeft = FIELD.x + FIELD.width - FIELD.endZoneWidth;

      // Player 1 scores in the right end zone
      if (ball.carrier === player1 && player1.x >= rightEndZoneLeft) {
        scorePoint(player1);
        return;
      }

      // CPU scores in the left end zone
      if (ball.carrier === player2 && player2.x <= leftEndZoneRight) {
        scorePoint(player2);
      }
    }

    function scorePoint(scorer) {
      if (game.state !== "playing") return;

      scorer.score += 1;
      game.scoredBy = scorer;
      game.state = "scorePause";
      game.scorePauseTimer = CONFIG.scorePauseMs;
      ball.carrier = null;

      if (scorer.score >= CONFIG.winScore) {
        game.state = "gameOver";
        game.winner = scorer;
      }
    }

    function updatePlaying(dt) {
      updatePlayerInput(dt);
      updateCPU(dt);

      if (game.possessionLockTimer > 0) {
        game.possessionLockTimer -= dt * 1000;
        if (game.possessionLockTimer < 0) {
          game.possessionLockTimer = 0;
        }
      }

      tryPickupBall();
      handleCarrierCollisionSteal();
      updateBallPosition();
      checkTouchdown();
    }

    function updateScorePause(dt) {
      game.scorePauseTimer -= dt * 1000;
      if (game.scorePauseTimer <= 0) {
        game.scorePauseTimer = 0;
        game.scoredBy = null;
        resetPositions();
        game.state = "playing";
      }
    }

    function update(dt) {
      if (game.state === "playing") {
        updatePlaying(dt);
      } else if (game.state === "scorePause") {
        updateScorePause(dt);
      } else if (game.state === "gameOver") {
        updateBallPosition();
      }
    }

    // =========================================================
    // Rendering
    // =========================================================
    function drawRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }

    function drawField() {
      drawRect(0, 0, canvas.width, canvas.height, "#7fbf5b");

      // Dirt border around field
      drawRect(FIELD.x - 18, FIELD.y - 18, FIELD.width + 36, FIELD.height + 36, "#7c4a1d");

      // Main field
      drawRect(FIELD.x, FIELD.y, FIELD.width, FIELD.height, COLORS.field);

      // Grass stripes
      const stripeCount = 8;
      const stripeH = FIELD.height / stripeCount;
      for (let i = 0; i < stripeCount; i++) {
        if (i % 2 === 0) {
          drawRect(FIELD.x, FIELD.y + i * stripeH, FIELD.width, stripeH, COLORS.fieldStripe);
        }
      }

      // End zones
      drawRect(FIELD.x, FIELD.y, FIELD.endZoneWidth, FIELD.height, COLORS.leftEndZone);
      drawRect(FIELD.x + FIELD.width - FIELD.endZoneWidth, FIELD.y, FIELD.endZoneWidth, FIELD.height, COLORS.rightEndZone);

      // Boundary lines
      ctx.strokeStyle = COLORS.line;
      ctx.lineWidth = 4;
      ctx.strokeRect(FIELD.x, FIELD.y, FIELD.width, FIELD.height);

      // Midfield
      ctx.beginPath();
      ctx.moveTo(FIELD.x + FIELD.width / 2, FIELD.y);
      ctx.lineTo(FIELD.x + FIELD.width / 2, FIELD.y + FIELD.height);
      ctx.stroke();

      // Yard lines
      ctx.lineWidth = 2;
      for (let i = 1; i < 10; i++) {
        const x = FIELD.x + (FIELD.width / 10) * i;
        ctx.beginPath();
        ctx.moveTo(x, FIELD.y + 18);
        ctx.lineTo(x, FIELD.y + FIELD.height - 18);
        ctx.stroke();
      }

      // Midfield circle
      ctx.beginPath();
      ctx.arc(FIELD.x + FIELD.width / 2, FIELD.y + FIELD.height / 2, 44, 0, Math.PI * 2);
      ctx.stroke();

      // Fence posts
      for (let x = FIELD.x - 10; x <= FIELD.x + FIELD.width + 10; x += 32) {
        drawRect(x, FIELD.y - 30, 8, 22, COLORS.fence);
        drawRect(x, FIELD.y + FIELD.height + 8, 8, 22, COLORS.fence);
      }

      // Fence rails
      drawRect(FIELD.x - 10, FIELD.y - 20, FIELD.width + 20, 5, "#caa472");
      drawRect(FIELD.x - 10, FIELD.y - 10, FIELD.width + 20, 5, "#caa472");
      drawRect(FIELD.x - 10, FIELD.y + FIELD.height + 15, FIELD.width + 20, 5, "#caa472");
      drawRect(FIELD.x - 10, FIELD.y + FIELD.height + 25, FIELD.width + 20, 5, "#caa472");

      // Hay bales
      drawHayBale(FIELD.x + 18, FIELD.y - 60);
      drawHayBale(FIELD.x + FIELD.width - 64, FIELD.y - 60);
      drawHayBale(FIELD.x + 18, FIELD.y + FIELD.height + 36);
      drawHayBale(FIELD.x + FIELD.width - 64, FIELD.y + FIELD.height + 36);

      // End zone labels
      ctx.fillStyle = COLORS.white;
      ctx.font = "bold 22px Arial";
      ctx.textAlign = "center";
      ctx.fillText("BARNABY DEFENDS", FIELD.x + FIELD.endZoneWidth / 2, FIELD.y + FIELD.height / 2);
      ctx.save();
      ctx.translate(FIELD.x + FIELD.width - FIELD.endZoneWidth / 2, FIELD.y + FIELD.height / 2);
      ctx.rotate(Math.PI);
      ctx.fillText("PIG DEFENDS", 0, 0);
      ctx.restore();
    }

    function drawHayBale(x, y) {
      drawRect(x, y, 46, 26, COLORS.straw);
      ctx.strokeStyle = "#a16207";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, 46, 26);
      ctx.beginPath();
      ctx.moveTo(x + 8, y + 5);
      ctx.lineTo(x + 8, y + 21);
      ctx.moveTo(x + 23, y + 5);
      ctx.lineTo(x + 23, y + 21);
      ctx.moveTo(x + 38, y + 5);
      ctx.lineTo(x + 38, y + 21);
      ctx.stroke();
    }

    function drawShadow(x, y, radiusX, radiusY) {
      ctx.fillStyle = COLORS.shadow;
      ctx.beginPath();
      ctx.ellipse(x, y, radiusX, radiusY, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPlayer(player, label, accentText) {
      drawShadow(player.x, player.y + player.radius + 8, player.radius * 0.9, 7);

      // Body
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Ears / snout details
      if (player.id === "player1") {
        ctx.fillStyle = "#93c5fd";
        ctx.beginPath();
        ctx.ellipse(player.x - 8, player.y - 20, 5, 10, -0.3, 0, Math.PI * 2);
        ctx.ellipse(player.x + 8, player.y - 20, 5, 10, 0.3, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = "#f9a8d4";
        ctx.beginPath();
        ctx.ellipse(player.x, player.y + 4, 12, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#7f1d1d";
        ctx.beginPath();
        ctx.arc(player.x - 4, player.y + 4, 1.5, 0, Math.PI * 2);
        ctx.arc(player.x + 4, player.y + 4, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Eyes
      ctx.fillStyle = COLORS.white;
      ctx.beginPath();
      ctx.arc(player.x - 6, player.y - 5, 4, 0, Math.PI * 2);
      ctx.arc(player.x + 6, player.y - 5, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = COLORS.black;
      ctx.beginPath();
      ctx.arc(player.x - 6, player.y - 5, 2, 0, Math.PI * 2);
      ctx.arc(player.x + 6, player.y - 5, 2, 0, Math.PI * 2);
      ctx.fill();

      // Label
      ctx.fillStyle = COLORS.white;
      ctx.font = "bold 14px Arial";
      ctx.textAlign = "center";
      ctx.fillText(label, player.x, player.y - 30);

      // Ball marker
      if (ball.carrier === player) {
        ctx.fillStyle = accentText;
        ctx.font = "bold 12px Arial";
        ctx.fillText("BALL", player.x, player.y - 44);
      }
    }

    function drawBall() {
      drawShadow(ball.x, ball.y + 10, 10, 5);

      ctx.fillStyle = COLORS.ball;
      ctx.beginPath();
      ctx.ellipse(ball.x, ball.y, 12, 8, -0.35, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#5b3718";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Laces
      ctx.strokeStyle = COLORS.white;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(ball.x - 3, ball.y - 2);
      ctx.lineTo(ball.x + 3, ball.y + 2);
      ctx.moveTo(ball.x - 1, ball.y - 4);
      ctx.lineTo(ball.x + 5, ball.y + 0);
      ctx.moveTo(ball.x - 5, ball.y + 0);
      ctx.lineTo(ball.x + 1, ball.y + 4);
      ctx.stroke();
    }

    function drawScoreboard() {
      drawRect(0, 0, canvas.width, 58, "#111827");

      ctx.fillStyle = COLORS.white;
      ctx.font = "bold 26px Arial";
      ctx.textAlign = "center";
      ctx.fillText("Farm Football Frenzy", canvas.width / 2, 36);

      ctx.font = "bold 20px Arial";
      ctx.textAlign = "left";
      ctx.fillStyle = "#93c5fd";
      ctx.fillText(`Barnaby: ${player1.score}`, 24, 36);

      ctx.textAlign = "right";
      ctx.fillStyle = "#f9a8d4";
      ctx.fillText(`Professor Pig: ${player2.score}`, canvas.width - 24, 36);
    }

    function drawCenterMessage(title, subtitle) {
      ctx.fillStyle = "rgba(17, 24, 39, 0.78)";
      ctx.fillRect(180, 190, 600, 150);

      ctx.strokeStyle = COLORS.white;
      ctx.lineWidth = 3;
      ctx.strokeRect(180, 190, 600, 150);

      ctx.textAlign = "center";
      ctx.fillStyle = COLORS.white;
      ctx.font = "bold 34px Arial";
      ctx.fillText(title, canvas.width / 2, 245);

      ctx.font = "18px Arial";
      ctx.fillText(subtitle, canvas.width / 2, 285);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawField();
      drawScoreboard();
      drawPlayer(player1, "Barnaby", "#bfdbfe");
      drawPlayer(player2, "Professor Pig", "#fbcfe8");
      drawBall();

      if (game.state === "scorePause" && game.scoredBy) {
        const scorerName = game.scoredBy === player1 ? "Barnaby scores!" : "Professor Pig scores!";
        drawCenterMessage(scorerName, "Resetting for the next play...");
      } else if (game.state === "gameOver" && game.winner) {
        const winText = game.winner === player1 ? "Barnaby Wins!" : "Professor Pig Wins!";
        drawCenterMessage(winText, "Press R to restart");
      }
    }

    // =========================================================
    // Main Game Loop
    // =========================================================
    function gameLoop(timestamp) {
      if (!game.lastTime) game.lastTime = timestamp;
      const dt = Math.min((timestamp - game.lastTime) / 1000, 0.033);
      game.lastTime = timestamp;

      update(dt);
      render();

      requestAnimationFrame(gameLoop);
    }

    // =========================================================
    // Start Game
    // =========================================================
    restartGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
